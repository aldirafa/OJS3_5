<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">How a call travels</title>
  <desc id="desc">Request: your code calls a typed method such as ojs.Submissions.ListAsync(query); OjsClient builds the URL and query string, adds the Bearer API token and sends only the fields you set; the OJS 3.5 server answers at /index.php/{journal}/api/v1. Response: OJS returns PHP-style JSON; the normalizer fixes every value against the target model and turns 400 and 422 errors into OjsValidationException; your code gets typed results such as PagedResult(Of Submission), or an OjsApiException.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1C2430" stroke-width="1.6" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="440" rx="24" fill="#FBF8F2"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="23.5" fill="none" stroke="#E4DDD0"/>

  <!-- row labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2" fill="#6B7280">
    <text x="56" y="44">REQUEST →</text>
    <text x="56" y="250">← RESPONSE</text>
  </g>

  <!-- ===== request row ===== -->
  <g id="your-code" transform="translate(56 60)">
    <rect width="312" height="150" rx="12" fill="#FFFFFF" stroke="#D9D3C7"/>
    <text x="22" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.5" fill="#1C2430">YOUR CODE</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#1F4E79">
      <text x="22" y="76">ojs.Submissions</text>
      <text x="22" y="104">  .ListAsync(query)</text>
    </g>
    <text x="22" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#2E3742">typed queries and models</text>
  </g>

  <g id="client" transform="translate(440 60)">
    <rect width="312" height="150" rx="12" fill="#FFFFFF" stroke="#D9D3C7"/>
    <text x="22" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.5" fill="#1C2430">OJSCLIENT</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#2E3742">
      <text x="22" y="74">URL and query string</text>
      <text x="22" y="104">Bearer API token</text>
      <text x="22" y="134">sends only fields you set</text>
    </g>
  </g>

  <g id="server" transform="translate(824 60)">
    <rect width="320" height="356" rx="12" fill="#1F4E79"/>
    <text x="24" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">OJS 3.5 SERVER</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#DCE8F4">
      <text x="24" y="76">/index.php/{journal}</text>
      <text x="24" y="104">/api/v1/submissions</text>
    </g>
    <rect x="24" y="168" width="272" height="1" fill="#5C83AB"/>
    <text x="24" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1.5" fill="#BCD2E8">ANSWERS WITH PHP JSON</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#F0B66B">
      <text x="24" y="244">"5"  "0"  "1"</text>
      <text x="24" y="274">"0000-00-00"</text>
      <text x="24" y="304">[] for {}</text>
      <text x="24" y="334">{"0": …, "1": …}</text>
    </g>
  </g>

  <!-- request arrows -->
  <path d="M372 135 L434 135" stroke="#1C2430" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M756 135 L818 135" stroke="#1C2430" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== response row ===== -->
  <g id="normalizer" transform="translate(440 266)">
    <rect width="312" height="150" rx="12" fill="#FFFFFF" stroke="#D9D3C7"/>
    <text x="22" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.5" fill="#1C2430">NORMALIZER</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#2E3742">
      <text x="22" y="74">fixes each value against</text>
      <text x="22" y="104">the target model</text>
      <text x="22" y="134">400 / 422 → field errors</text>
    </g>
  </g>

  <g id="you-get" transform="translate(56 266)">
    <rect width="312" height="150" rx="12" fill="#1C2430"/>
    <text x="22" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.5" fill="#E8E4DA">YOU GET</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
      <text x="22" y="76" fill="#9CC3E6">PagedResult(Of T)</text>
      <text x="22" y="104" fill="#9CC3E6">Submission, Issue …</text>
      <text x="22" y="134" fill="#F0B66B">or OjsApiException</text>
    </g>
  </g>

  <!-- response arrows -->
  <path d="M818 341 L756 341" stroke="#1C2430" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M434 341 L372 341" stroke="#1C2430" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
</svg>
