name: Release

# Push a tag such as v0.1.0-preview or v1.2.0 to publish that version to nuget.org.
# Publishing uses NuGet Trusted Publishing (OIDC): no API key is stored anywhere.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # request the OIDC token for nuget.org
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not v<major>.<minor>.<patch>[-suffix]" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build
        run: dotnet build OJS3_5.slnx -c Release -warnaserror -p:Version=${{ steps.version.outputs.version }} -p:ContinuousIntegrationBuild=true

      - name: Unit tests
        run: dotnet test OJS3_5.slnx -c Release --no-build --filter "TestCategory!=Live&TestCategory!=LiveWrite"

      - name: Pack
        run: >-
          dotnet pack Library/Library.vbproj -c Release --no-build -o artifacts
          -p:Version=${{ steps.version.outputs.version }} -p:ContinuousIntegrationBuild=true

      - name: Log in to nuget.org (Trusted Publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'aldirafa' }}

      - name: Push to nuget.org
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --title "$GITHUB_REF_NAME" --generate-notes
          ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }}
